<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pranam — 9 Types of Punya Bandh</title>
    <link rel="stylesheet" href="./assets/css/style.css">
    <link rel="stylesheet" href="./assets/css/pranam.css">
</head>

<body id="body">
    <div id="langSelect">
        <div id="language">
            <label><input type="radio" onclick="val('English')" name="lang" id="en" value="English">
                <span>E</span>
            </label>
            <label><input type="radio" onclick="val('Hindi')" name="lang" id="hi" value="Hindi">
                <span>H</span>
            </label>
            <label><input type="radio" onclick="val('Gujrati')" name="lang" id="gu" value="Gujrati">
                <span>G</span>
            </label>
        </div>
    </div>

    <img class="bg-img" src="./assets/images/bg-1.png" alt="">

    <div class="main-container">

        <div class="decor fl1" aria-hidden="true">
            <div class="decor__spin">
                <img src="./assets/images/FL2.png" alt="">
            </div>
        </div>
        <div class="decor fl2" aria-hidden="true">
            <div class="decor__spin">
                <img src="./assets/images/FL2.png" alt="">
            </div>
        </div>

        <a href="./types.html?subpoint=9" class="left-corner btn-home">
            <img src="./assets/images/back.png" alt="Back">
        </a>

        <div class="pranam-container">
            <div class="pranam-img">
                <span class="english">Pranam</span>
                <span class="hindi">प्रणाम</span>
                <span class="gujrati">પ્રણામ</span>
                <img src="./assets/images/pranaam.png" alt="">
                <div class="pranam-video">
                    <video src="./assets/videos/pranam.mp4" autoplay muted loop playsinline></video>
                </div>
            </div>

            <a href="./index.html" class="home-btn-1">
                <span class="english">Home</span>
                <span class="hindi">होम</span>
                <span class="gujrati">ઘર</span>
                <img src="./assets/images/homebtn.png" alt="Home">
            </a>
        </div>

    </div>

    <script src="./assets/js/djp.js"></script>
    <script src="./assets/js/jquery-3.7.1.js"></script>
    <script src="./assets/js/custom.js"></script>
    <script>
      (function () {
        "use strict";

        var pranamSound = new Audio("./assets/audio/pranam.mp3");
        pranamSound.preload = "auto";

        var pranamHasPlayed = false;

        function playPranamOnce() {
          if (pranamHasPlayed) return;
          pranamHasPlayed = true;

          var playPromise = pranamSound.play();
          if (playPromise !== undefined) {
            playPromise.catch(function () {
              // browser blocked autoplay, retry on the first real interaction
              pranamHasPlayed = false;
              waitForInteraction();
            });
          }
        }

        function waitForInteraction() {
          function trigger() {
            document.removeEventListener("click", trigger);
            document.removeEventListener("keydown", trigger);
            document.removeEventListener("touchstart", trigger);
            playPranamOnce();
          }

          document.addEventListener("click", trigger, { once: true });
          document.addEventListener("keydown", trigger, { once: true });
          document.addEventListener("touchstart", trigger, { once: true });
        }

        window.addEventListener("DOMContentLoaded", playPranamOnce);
      })();
    </script>
</body>

</html>
